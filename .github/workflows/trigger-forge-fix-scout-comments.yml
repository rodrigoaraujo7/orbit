name: trigger-forge-fix-scout-comments

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify-forge:
    if: |
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == 'cursor[bot]' &&
      contains(github.event.review.body, '877cf90e-c02c-11f1-bb68-864e54d14197')
    runs-on: ubuntu-latest
    steps:
      - name: Start Forge
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_FORGE_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.CURSOR_FORGE_WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"context":"Scout requested changes on ${{ github.event.pull_request.html_url }}"}'
